name: Verificar rutas de GitHub Pages

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pages-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/lib/price-*.node.mjs
      - run: npm exec --no -- tsc -p tsconfig.app.json --pretty false
      - run: npm exec --no -- tsc -p tsconfig.node.json --pretty false
      - run: npm run build
      - run: npm exec --no -- playwright install chromium --with-deps
      - run: node scripts/verify-pages-browser.mjs

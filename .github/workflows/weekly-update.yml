name: Advanced Weekly Content Update

on:
  schedule:
    - cron: "23 12 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/weekly-update.yml'
      - 'scripts/audit-price-sources.py'
      - 'scripts/test_audit_price_sources.py'

permissions:
  contents: read

concurrency:
  group: price-source-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test source contracts
        run: python3 -m unittest discover -s scripts -p 'test_audit_price_sources.py'
      - name: Audit official price sources
        if: github.event_name != 'pull_request'
        run: python3 scripts/audit-price-sources.py "$RUNNER_TEMP/price-source-report.json"
      - name: Upload audit evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: price-source-report
          path: ${{ runner.temp }}/price-source-report.json
          retention-days: 14
          if-no-files-found: error

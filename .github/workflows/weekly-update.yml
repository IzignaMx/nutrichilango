name: Validar procedencia de precios

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/weekly-update.yml'
      - 'data/price-source-allowlist.json'
      - 'scripts/**'
      - 'src/data/price-normalization.mjs'
      - 'src/data/stores/**'
      - 'src/data/metadata.ts'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validar-precios:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Verificar el registro de fuentes
        run: node scripts/update-data.mjs --check-allowlist

      - name: Probar admisión y normalización con observaciones sintéticas
        run: node --test scripts/lib/price-*.node.mjs

      - name: Verificar que se conservó el catálogo
        run: git diff --exit-code -- src/data/stores src/data/metadata.ts

      - name: Resumir el alcance
        if: success()
        run: |
          echo 'Validación local de procedencia con datos sintéticos. No se consultaron tiendas, no se aplicaron precios reales y no se abrió un PR de datos.' >> "$GITHUB_STEP_SUMMARY"

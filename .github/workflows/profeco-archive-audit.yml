name: Profeco archive sample audit

on:
  schedule:
    - cron: "23 12 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profeco-archive-audit.yml'
      - 'scripts/inspect-profeco-archive.py'
      - 'scripts/audit-price-sources.py'
      - 'scripts/profeco-cache.py'
  pull_request:
    paths:
      - '.github/workflows/profeco-archive-audit.yml'
      - 'scripts/inspect-profeco-archive.py'
      - 'scripts/audit-price-sources.py'
      - 'scripts/profeco-cache.py'
      - 'scripts/test_inspect_profeco_archive.py'
      - 'scripts/test_audit_price_sources.py'
      - 'scripts/test_profeco_cache.py'

permissions:
  contents: read

concurrency:
  group: profeco-archive-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test bounded archive reader
        run: |
          python3 -m unittest discover -s scripts -p 'test_inspect_profeco_archive.py'
          python3 -m unittest discover -s scripts -p 'test_audit_price_sources.py'
          python3 -m unittest discover -s scripts -p 'test_profeco_cache.py'
      - name: Verify source metadata
        if: github.event_name != 'pull_request'
        run: python3 scripts/audit-price-sources.py "$RUNNER_TEMP/price-source-report.json"
      - name: Derive exact cache key
        id: cache-key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 scripts/profeco-cache.py key "$RUNNER_TEMP/price-source-report.json"
      - name: Restore audit summary
        id: cache-restore
        if: steps.cache-key.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/profeco-cache/summary.json
          key: profeco-audit-v1-${{ steps.cache-key.outputs.key }}
      - name: Validate cached summary
        id: cache-read
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: python3 scripts/profeco-cache.py restore "$RUNNER_TEMP/price-source-report.json" "$RUNNER_TEMP/profeco-cache/summary.json" "$RUNNER_TEMP/profeco-archive-sample.json"
      - name: Sample official archive
        id: archive-audit
        if: github.event_name != 'pull_request' && steps.cache-read.outputs.reused != 'true'
        run: python3 scripts/inspect-profeco-archive.py "$RUNNER_TEMP/price-source-report.json" "$RUNNER_TEMP/profeco-archive-sample.json"
      - name: Prepare aggregate-only cache
        id: cache-prepare
        if: steps.cache-key.outputs.eligible == 'true' && steps.cache-read.outputs.reused != 'true' && steps.cache-restore.outputs.cache-hit != 'true'
        run: python3 scripts/profeco-cache.py save "$RUNNER_TEMP/price-source-report.json" "$RUNNER_TEMP/profeco-cache/summary.json" "$RUNNER_TEMP/profeco-archive-sample.json"
      - name: Save immutable summary
        if: steps.cache-prepare.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/profeco-cache/summary.json
          key: profeco-audit-v1-${{ steps.cache-key.outputs.key }}
      - name: Report audit and cache outcome
        if: always() && github.event_name != 'pull_request'
        env:
          CACHE_REUSED: ${{ steps.cache-read.outputs.reused }}
          CACHE_RESTORE: ${{ steps.cache-restore.outcome }}
          CACHE_SAVE: ${{ steps.cache-prepare.outputs.ready }}
          AUDIT_OUTCOME: ${{ steps.archive-audit.outcome }}
        run: |
          {
            echo '## Profeco: auditoría de solo lectura'
            if [ "$CACHE_REUSED" = true ]; then
              echo 'Resumen validado de caché; descarga anual omitida.'
            elif [ "$AUDIT_OUTCOME" = success ]; then
              echo 'Lectura del archivo oficial realizada.'
            else
              echo 'No se completó la auditoría en vivo.'
            fi
            echo "Restauración de caché: ${CACHE_RESTORE:-no ejecutada}"
            echo "Resumen elegible para guardar: ${CACHE_SAVE:-no}"
            echo 'No se actualizó el catálogo ni se publicaron precios.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit artifacts
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: profeco-archive-evidence
          path: |
            ${{ runner.temp }}/price-source-report.json
            ${{ runner.temp }}/profeco-archive-sample.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve weekly metadata artifact
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: price-source-report
          path: ${{ runner.temp }}/price-source-report.json
          retention-days: 14
          if-no-files-found: error
